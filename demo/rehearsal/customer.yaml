# Act 4, beat 2: the change a well meaning engineer would open as a PR. It is
# not part of the registry; demo/act4-policy.sh overlays it on top of
# telemetry-schema/attributes/ to show the Rego policy rejecting it.
file_format: definition/2
attributes:
  - key: app.customer.tier
    type: string
    brief: Customer tier
    stability: development
    annotations:
      owner: customer
    examples: ["gold", "silver"]
